[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring Docker Postgres (testcontainers)",
    "live: tests hitting real external APIs (need API keys)",
    "e2e: end-to-end pipeline quality gate (requires API keys, live network)",
]
addopts = "-m 'not live and not integration and not e2e'"
