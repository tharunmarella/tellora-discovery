name: tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: unit + parsing (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit + parsing tests
        run: pytest -m "not live and not integration" -v

  coverage:
    name: coverage gate 75% (Docker Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # testcontainers drives the Docker daemon that ships on GitHub runners;
      # it spins up pgvector/pgvector:pg15 for the DB-backed tests.
      - name: Run non-live tests with scoped 75% coverage gate
        run: pytest -m "not live and not e2e" --cov --cov-config=.coveragerc --cov-fail-under=75 -v
